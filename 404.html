<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte – Ellesse</title>
  <meta name="description" content="Sidan du letade efter verkar inte finnas. Gå tillbaka till Ellesse frisörsalong.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #D8D8C0;
      color: #303030;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    header {
      background-color: rgba(216, 216, 192, 0.95);
      border-bottom: 1px solid rgba(200, 168, 152, 0.2);
      padding: 0 2rem;
      height: 68px;
      display: flex;
      align-items: center;
    }
    .site-logo { max-height: 44px; width: auto; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem;
      text-align: center;
    }

    .error-badge {
      display: inline-block;
      background-color: #C8A898;
      color: #fff;
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      padding: 1rem 2rem;
      border-radius: 12px;
      margin-bottom: 2.5rem;
      letter-spacing: -0.03em;
    }

    h1 {
      font-family: Georgia, "Iowan Old Style", serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: -0.02em;
      color: #303030;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.05rem;
      color: #7A7A6E;
      line-height: 1.75;
      max-width: 50ch;
      margin: 0 auto 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #C8A898;
      color: #fff;
      transition: background-color 200ms ease-out, box-shadow 200ms ease-out, transform 200ms ease-out;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #b89082;
      box-shadow: 0 6px 24px rgba(200, 168, 152, 0.4);
      transform: translateY(-2px);
    }

    footer {
      background-color: #303030;
      padding: 1.5rem 2rem;
      text-align: center;
    }
    footer p {
      font-size: 0.75rem;
      color: rgba(245, 240, 232, 0.35);
      margin: 0 auto;
      max-width: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: background-color 200ms ease-out; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">
      <img src="logo.png" alt="Ellesse" class="site-logo">
    </a>
  </header>

  <main>
    <div class="error-badge">404</div>
    <h1>Hoppsan, den sidan finns inte</h1>
    <p>Det verkar som att länken du följde inte leder någonstans. Kanske har sidan flyttats eller stavas fel – men du hittar oss alltid på startsidan.</p>
    <a href="index.html" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Tillbaka till startsidan
    </a>
  </main>

  <footer>
    <p>&copy; 2024 Ellesse, Ulricehamn – Storgatan 15, 523 30 Ulricehamn</p>
  </footer>
</body>
</html>
